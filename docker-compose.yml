services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: "2"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
